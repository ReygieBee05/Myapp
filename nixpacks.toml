[variables]
NIXPACKS_PHP_VERSION = "8.4"
COMPOSER_ALLOW_SUPERUSER = "1"

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install --no-audit --prefer-offline"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT}"